name: Refresh official budget data

on:
  schedule:
    # Official publications land on different days; check every Friday.
    - cron: '0 15 * * 5'
  push:
    paths:
      - 'scraper_automation.py'
      - '.github/workflows/monthly_scraper.yml'
  workflow_dispatch:
    inputs:
      target_month:
        description: 'Latest report month to include (YYYY-MM); blank uses latest'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: budget-data-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Refresh public JSON
        run: |
          if [ -n "${{ inputs.target_month }}" ]; then
            python scraper_automation.py --output public/dashboard_data.json --month "${{ inputs.target_month }}"
          else
            python scraper_automation.py --output public/dashboard_data.json
          fi
      - name: Validate data and app
        run: |
          python -m json.tool public/dashboard_data.json > /dev/null
          python -m unittest discover -s tests -v
          npm ci
          npm run build
      - name: Commit changed data
        run: |
          if git diff --quiet -- public/dashboard_data.json; then
            echo "Official source data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/dashboard_data.json
          git commit -m "data: refresh official Nebraska budget snapshot [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
